services:
  detector:
    build: .
    env_file: ".env"
    container_name: deadbolt-detector
    ports:
      - "5001:5000"      # WebUI access
    environment:
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT:-1883}
      # Base topic: state/availability/camera/command subtopics are appended.
      - MQTT_TOPIC=${MQTT_TOPIC:-home/deadbolt}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASS=${MQTT_PASS:-}
      - CAMERA_URL=${CAMERA_URL}
      - DETECTOR_DEBUG=${DETECTOR_DEBUG:-0}
      - REFRESH_RATE=${REFRESH_RATE:-5}    # Camera poll interval in seconds (default: 5)
    volumes:
      - ./config:/app/config
    restart: unless-stopped
